# Repos that devkit manages.
#
# scripts/sync.ts renders `files` (from templates/) and the AGENTS block into each repo.
# scripts/repo-settings.ts compares GitHub settings with `settings`, `description`,
# `homepage`, `topics` and `required_checks` below. A field that is left out is not managed.
#
# `required_checks` manages a branch ruleset named "main (devkit)": the default branch
# can't be deleted or force-pushed and needs these checks to pass; repository admins
# bypass it. homebrew-tap has no required checks on purpose (see docs/standards/homebrew.md).
#
# Keys under `repos` are the GitHub repo names under `owner`, which are also the
# folder names of local checkouts.
#
# A repo's own `files` add managed files for that repo only, such as the usage telemetry
# client (docs/standards/telemetry.md).
#
# A repo with `frozen_until` in the future is skipped by sync and by
# repo-settings --apply. It still shows up in the settings diff.

owner: neoromantic

# Settings every repo should have unless it overrides them.
settings:
  has_wiki: false
  has_projects: false
  delete_branch_on_merge: true
  secret_scanning: true
  secret_scanning_push_protection: true
  private_vulnerability_reporting: true

# Managed files every profile gets: target path in the repo -> file in templates/.
files:
  SECURITY.md: SECURITY.md
  .gitleaks.toml: .gitleaks.toml
  .github/zizmor.yml: zizmor.yml
  renovate.json: renovate.json
  lefthook.yml: lefthook.yml

profiles:
  bun:
    files:
      .github/workflows/ci.yml: ci.bun.yml
      CONTRIBUTING.md: CONTRIBUTING.md
      .github/PULL_REQUEST_TEMPLATE.md: PULL_REQUEST_TEMPLATE.md
  python:
    files:
      .github/workflows/ci.yml: ci.python.yml
      CONTRIBUTING.md: CONTRIBUTING.md
      .github/PULL_REQUEST_TEMPLATE.md: PULL_REQUEST_TEMPLATE.md
  # Agent skills: no CI stub yet (stdlib Python, tests run with uv run python -m unittest).
  skill:
    files:
      CONTRIBUTING.md: CONTRIBUTING.md
      .github/PULL_REQUEST_TEMPLATE.md: PULL_REQUEST_TEMPLATE.md
  # Go keeps its own ci.yml and adds hygiene.yml by hand.
  go:
    files:
      CONTRIBUTING.md: CONTRIBUTING.md
      .github/PULL_REQUEST_TEMPLATE.md: PULL_REQUEST_TEMPLATE.md
  infra:
    files: {}

repos:
  telegram-sync-cli:
    profile: bun
    description: Agent-friendly Telegram CLI with a local cache, a read-only sync daemon and full MTProto API access.
    homepage: https://tg.sergeybaus.com
    topics: [telegram, cli, bun, mtproto, sqlite, sergeybaus-oss]
    required_checks: [ci]
    files:
      src/telemetry/client.ts: telemetry/telemetry.ts

  telesec:
    profile: python
    description: Telesec — Telegram Business secretary for Hermes
    homepage: https://telesec.sergeybaus.com
    topics:
      - hermes-agent
      - python
      - speech-to-text
      - telegram-business
      - hermes-plugin
      - voice-transcription
      - hermes-agent-plugin
      - telegram
      - telegram-bot
      - transcription
      - voice-to-text
      - sergeybaus-oss
    required_checks: [ci]
    files:
      telemetry.py: telemetry/telemetry.py

  ornament-skill:
    profile: skill
    description: "Claude Code skill for the Ornament Health API: read profiles, lab biomarkers, history, abnormal results, and health-condition scores."
    topics: [claude-code, agent-skills, ornament-health, biomarkers, sergeybaus-oss]
    required_checks: [ci]

  evals:
    profile: bun
    maintenance: true
    description: Pragmatic eval framework for LLM features. Runs eval files as Bun tests with scorers, baselines, and reporting.
    topics: [llm, evals, bun, testing]
    required_checks: [ci]

  homebrew-tap:
    profile: infra
    # Formula updates belong to product release pipelines.
    exclude: [renovate.json]
    description: "Homebrew formulae of neoromantic's tools: ai-usage"
    topics: [homebrew, homebrew-tap]

  devkit:
    profile: infra
    description: Shared CI workflows, git hooks, templates and agent rules for neoromantic's open-source repos
    topics: [github-actions, reusable-workflows, lefthook, renovate, gitleaks, developer-tools]
    # devkit runs its hooks from its own lefthook.yml, not through a remote.
    exclude: [lefthook.yml]

  ai-usage:
    profile: go
    description: Local usage collector for Codex, Claude, Grok, and Hermes.
    homepage: https://au.sergeybaus.com
    topics: [claude-code, codex, cli, go, sergeybaus-oss]
    required_checks: [ci]
    files:
      internal/telemetry/telemetry.go: telemetry/telemetry.go

  bb-plugin-provider-retry-advanced:
    profile: bun
    description: "BB plugin: provider retry plus automatic resume after lost connectivity."
    topics: [bb, bb-plugin, bun, sergeybaus-oss]
    # Keeps the repo's current private vulnerability reporting setting.
    settings:
      private_vulnerability_reporting: false
    required_checks: [ci]
