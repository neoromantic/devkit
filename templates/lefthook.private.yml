# managed by devkit v1: edit in https://github.com/neoromantic/devkit/blob/main/templates/lefthook.private.yml
# Shared hooks for private repos: gitleaks and the oxfmt and oxlint check of staged files, without
# the public privacy scan. Paths listed in .devkit-exclude are never read. Install once per clone:
# lefthook install
remotes:
  - git_url: https://github.com/neoromantic/devkit
    ref: v1
    refetch_frequency: 24h
    configs:
      - lefthook/private.yml
