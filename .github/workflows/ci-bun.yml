# Reusable CI for Bun repos.
#
# Runs the script contract from package.json, skipping scripts that don't exist:
#   check (or lint + typecheck) -> build -> pack (when pack: true) -> test -> test:e2e (when e2e: true)
#
# A repo on the shared lint and format standard runs oxfmt and oxlint inside `check`
# (docs/standards/lint-format.md); this workflow only makes sure Node is new enough for them.
#
# pack: true checks the release artifact without publishing it: `bun pm pack`, install the tarball
# in a clean temp project outside the checkout (fresh HOME, allowlisted environment, no job
# secrets), then run every CLI from package.json `bin` with pack-args. Each run must exit 0.
# See docs/standards/pack-smoke.md.
#
# Usage (see templates/ci.bun.yml):
#   jobs:
#     build:
#       uses: neoromantic/devkit/.github/workflows/ci-bun.yml@v1
#       permissions: { contents: read }
#       with: { e2e: true, os: '["ubuntu-latest","macos-latest"]' }
name: ci-bun

on:
  workflow_call:
    inputs:
      os:
        description: JSON list of runner labels
        type: string
        default: '["ubuntu-latest"]'
      working-directory:
        description: Directory with package.json
        type: string
        default: .
      bun-version:
        description: Bun version. Empty means .bun-version, then packageManager in package.json, then latest
        type: string
        default: ""
      canary:
        description: Use Bun canary (for scheduled early-warning runs)
        type: boolean
        default: false
      e2e:
        description: Run the test:e2e script if it exists
        type: boolean
        default: false
      pack:
        description: Pack with bun pm pack, install the tarball in a clean temp project and run its bin CLIs
        type: boolean
        default: false
      pack-args:
        description: 'JSON argv, or list of argv lists, run for every packed CLI. Empty means [["--help"]]'
        type: string
        default: ""

permissions: {}

jobs:
  bun:
    if: github.event.pull_request.draft != true
    name: bun (${{ matrix.os }})
    runs-on: ${{ fromJSON(format('{{"true":"oss-linux","false":"{0}"}}', matrix.os))[format('{0}', vars.CI_SELF_HOSTED == 'true' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest')] }}
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: devkit-ci-bun-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working-directory }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Temp files (test databases, sockets) go to the runner's own temp dir. On the
      # self-hosted oss-linux runners that is tmpfs, while /tmp sits on a slow disk.
      - name: Use the runner temp dir
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Resolve Bun version
        id: bun
        env:
          INPUT_VERSION: ${{ inputs.bun-version }}
          CANARY: ${{ inputs.canary }}
        run: |
          version="$INPUT_VERSION"
          if [ "$CANARY" = "true" ]; then
            version=canary
          elif [ -z "$version" ] && [ -f .bun-version ]; then
            version="$(tr -d '[:space:]' < .bun-version)"
          elif [ -z "$version" ] && [ -f package.json ]; then
            version="$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"bun@\([^"]*\)".*/\1/p' package.json | head -n 1)"
          fi
          echo "version=${version:-latest}" >> "$GITHUB_OUTPUT"
          echo "Bun ${version:-latest}"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install
        run: bun install --frozen-lockfile

      # A repo that pins Node (.node-version or .nvmrc) gets exactly that Node. Otherwise the
      # landmines rules of the shared lint standard, oxlint JS plugins, need Node 22.18 or later:
      # a repo on the standard (.oxlintrc.devkit.jsonc) gets Node 24 when the runner has none or
      # an older one; other repos skip this.
      - name: Resolve Node
        id: node
        run: |
          setup=false file=""
          if [ -f .node-version ]; then file=.node-version; elif [ -f .nvmrc ]; then file=.nvmrc; fi
          if [ -n "$file" ]; then
            setup=true
            echo "Node from $file"
          elif [ -f .oxlintrc.devkit.jsonc ]; then
            version="$(node -p process.versions.node 2>/dev/null || echo 0.0.0)"
            IFS=. read -r major minor _ <<< "$version"
            if [ "$major" -lt 22 ] || { [ "$major" -eq 22 ] && [ "$minor" -lt 18 ]; }; then
              setup=true
            fi
            echo "Node $version on the runner; setup: $setup"
          fi
          { echo "setup=$setup"; echo "file=$file"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.node.outputs.setup == 'true'
        with:
          node-version: ${{ steps.node.outputs.file == '' && '24' || '' }}
          node-version-file: ${{ steps.node.outputs.file != '' && format('{0}/{1}', inputs.working-directory, steps.node.outputs.file) || '' }}
          package-manager-cache: false

      - name: Check
        run: |
          has() { bun -e "process.exit(require('./package.json').scripts?.['$1'] ? 0 : 1)"; }
          if has check; then
            bun run check
          else
            ran=0
            if has lint; then bun run lint; ran=1; fi
            if has typecheck; then bun run typecheck; ran=1; fi
            [ "$ran" = 1 ] || echo "::notice::no check, lint or typecheck script; skipped"
          fi

      - name: Build
        run: |
          if bun -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            bun run build
          else
            echo "no build script; skipped"
          fi

      # The helper comes from the devkit revision this workflow was called at. actions/checkout
      # only writes inside the workspace, so the helper moves to the temp dir and the checkout is
      # removed before anything is packed. fromJSON(toJSON(job)) reads job.workflow_repository and
      # job.workflow_sha, which actionlint 1.7.12's context table does not list yet.
      - name: Fetch the pack helper
        if: inputs.pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .devkit-pack-helper
          sparse-checkout: scripts/pack-smoke.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Pack and run the installed CLI
        if: inputs.pack
        env:
          DEVKIT_PACK_DIR: ${{ github.workspace }}/${{ inputs.working-directory }}
          DEVKIT_PACK_ARGS: ${{ inputs.pack-args }}
        run: |
          helper="$RUNNER_TEMP/devkit-pack-smoke.ts"
          mv "$GITHUB_WORKSPACE/.devkit-pack-helper/scripts/pack-smoke.ts" "$helper"
          rm -rf "$GITHUB_WORKSPACE/.devkit-pack-helper"
          # From the temp dir, so the project's bunfig.toml does not apply to the helper itself.
          cd "$RUNNER_TEMP"
          bun "$helper"

      - name: Test
        run: |
          if bun -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            bun run test
          else
            echo "::notice::no test script; skipped"
          fi

      - name: Test (e2e)
        if: inputs.e2e
        run: |
          if bun -e "process.exit(require('./package.json').scripts?.['test:e2e'] ? 0 : 1)"; then
            bun run test:e2e
          else
            echo "::notice::e2e requested but there is no test:e2e script; skipped"
          fi
