# Reusable hygiene checks for any repo.
#
#   actionlint  workflow correctness
#   zizmor      workflow security (offline audits)
#   gitleaks    secrets in the new commits (PR or push range); full history on schedule/dispatch
#   boundary    devkit privacy scan, generic patterns, on lines added by the PR or push
#
# Usage (see templates/ci.*.yml):
#   jobs:
#     hygiene:
#       uses: neoromantic/devkit/.github/workflows/hygiene.yml@v1
#       permissions: { contents: read }
name: hygiene

on:
  workflow_call:
    inputs:
      runner:
        description: JSON array of runner labels
        type: string
        default: '["ubuntu-latest"]'
      actionlint:
        type: boolean
        default: true
      zizmor:
        type: boolean
        default: true
      zizmor-path:
        description: Directory to audit; use .github when other directories must not be traversed
        type: string
        default: .
      gitleaks:
        type: boolean
        default: true
      gitleaks-log-opts:
        description: Additional git log options and pathspecs, appended to the commit range
        type: string
        default: ''
      boundary-scan:
        description: Run the devkit privacy scan (generic patterns) on added lines
        type: boolean
        default: true
      devkit-ref:
        description: devkit ref to take the privacy scan from
        type: string
        default: v1

permissions: {}

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ZIZMOR_VERSION: 1.31.1

jobs:
  hygiene:
    if: github.event.pull_request.draft != true
    runs-on: ${{ fromJSON(format('{{"true":["oss-linux"],"false":{0}}}', inputs.runner))[format('{0}', vars.CI_SELF_HOSTED == 'true' && github.ref == 'refs/heads/main' && inputs.runner == '["ubuntu-latest"]')] }}
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: devkit-hygiene-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Work out the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # log: commits to scan for secrets. diff: lines to scan for private text.
          log="" diff=""
          if [ "$EVENT" = "pull_request" ]; then
            log="$PR_BASE..$PR_HEAD" diff="$PR_BASE...$PR_HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            log="$PUSH_BEFORE..$PUSH_AFTER" diff="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          { echo "log=$log"; echo "diff=$diff"; } >> "$GITHUB_OUTPUT"
          echo "commits: ${log:-<full history>}"

      - name: actionlint
        if: inputs.actionlint && hashFiles('.github/workflows/*.yml', '.github/workflows/*.yaml') != ''
        run: |
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP/bin" actionlint && rm actionlint.tar.gz
          "$RUNNER_TEMP/bin/actionlint" -color

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: inputs.zizmor
        with:
          enable-cache: false
          ignore-empty-workdir: true

      - name: zizmor
        if: inputs.zizmor
        env:
          ZIZMOR_PATH: ${{ inputs.zizmor-path }}
        run: uvx "zizmor@${ZIZMOR_VERSION}" --offline --format=github "$ZIZMOR_PATH"

      - name: gitleaks
        if: inputs.gitleaks
        env:
          RANGE: ${{ steps.range.outputs.log }}
          GITLEAKS_LOG_OPTS: ${{ inputs.gitleaks-log-opts }}
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks && rm gitleaks.tar.gz
          args=(git --redact --no-banner --verbose --exit-code 1)
          if [ -n "$RANGE$GITLEAKS_LOG_OPTS" ]; then args+=(--log-opts="$RANGE $GITLEAKS_LOG_OPTS"); fi
          "$RUNNER_TEMP/bin/gitleaks" "${args[@]}" .

      - name: Check out devkit for the privacy scan
        if: inputs.boundary-scan && steps.range.outputs.diff != '' && github.repository != 'neoromantic/devkit'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neoromantic/devkit
          ref: ${{ inputs.devkit-ref }}
          path: .devkit-scan
          persist-credentials: false

      # On Linux and macOS setup-bun installs into $HOME/.bun/bin. A job-private HOME keeps it from
      # replacing the shared ~/.bun/bin/bun on self-hosted runners while another job's bun still runs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: inputs.boundary-scan && steps.range.outputs.diff != ''
        env:
          HOME: ${{ runner.temp }}
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Boundary scan (added lines)
        if: inputs.boundary-scan && steps.range.outputs.diff != ''
        env:
          RANGE: ${{ steps.range.outputs.diff }}
          SELF: ${{ github.repository == 'neoromantic/devkit' }}
        run: |
          script=.devkit-scan/scripts/privacy-scan.ts
          if [ "$SELF" = "true" ]; then script=scripts/privacy-scan.ts; fi
          bun "$script" --no-markers --diff "$RANGE"
