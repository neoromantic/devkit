# managed by devkit v1: shared git hooks, pulled into each repo through lefthook `remotes`.
# Needs gitleaks and Bun on PATH. Private markers: ~/.config/devkit/private-markers (mode 0600).
# oxc.ts checks staged files with oxfmt and oxlint only in repos on the shared lint and format
# standard (docs/standards/lint-format.md); elsewhere it does nothing. Before a push, knip.ts runs
# the repo's own `bun run check:knip` when the root package.json has that script.
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --no-banner --verbose
      # gitleaks reads `git diff`, which finds nothing when git colour output is forced on.
      env:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: color.diff
        GIT_CONFIG_VALUE_0: never
  scripts:
    "privacy-scan.ts":
      runner: bun
    "oxc.ts":
      runner: bun
pre-push:
  scripts:
    "knip.ts":
      runner: bun
