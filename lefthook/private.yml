# managed by devkit v1: shared git hooks for private repos, without the public privacy scan.
# Needs gitleaks and Bun on PATH. Paths listed in the repo's .devkit-exclude are never read.
# oxc.ts checks staged files with oxfmt and oxlint only in repos on the shared lint and format
# standard (docs/standards/lint-format.md); elsewhere it does nothing.
pre-commit:
  parallel: true
  scripts:
    "gitleaks-staged.ts":
      runner: bun
    "oxc.ts":
      runner: bun
