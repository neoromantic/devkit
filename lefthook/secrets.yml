# managed by devkit v1: secret checks for public and private repos. Needs gitleaks on PATH.
pre-commit:
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --no-banner --verbose
      # gitleaks reads `git diff`, which finds nothing when git colour output is forced on.
      env:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: color.diff
        GIT_CONFIG_VALUE_0: never
